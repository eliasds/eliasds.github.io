<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dicotic – Join the mailing list</title>
    <meta
      name="description"
      content="Sign up for dicotic updates, launch news, and divided listening tips."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="img/icon.png" type="image/png" />
  </head>
  <body>
    <main class="legal-main mailing-page">
      <div class="container legal-container">
        <a href="index.html" class="legal-back-link">← Back to dicotic home</a>

        <header class="legal-header">
          <p class="eyebrow">Stay in the loop</p>
          <h1>Join the mailing list</h1>
          <p class="legal-meta">
            Get launch updates, tips for divided listening, and occasional notes from the developer.
          </p>
        </header>

        <!-- Hidden iframe for silent submission -->
        <iframe name="hidden_iframe" style="display: none;"></iframe>

        <form
          class="mailing-form"
          action="https://docs.google.com/forms/d/e/1FAIpQLSeP2akVgiXygHPQDdrEaNfh5xmDexKQLyDse47u38-w9UYIoA/formResponse"
          method="POST"
          target="hidden_iframe"
          onsubmit="return handleSubmit(event)"
        >
          <!-- Honeypot field -->
          <div style="position: absolute; left: -9999px;">
            <label for="phone_number">Phone</label>
            <input
              id="phone_number"
              type="text"
              name="phone_number"
              tabindex="-1"
              autocomplete="off"
            />
          </div>

          <div class="form-field">
            <label for="mailing-email">Your email</label>
            <input
              id="mailing-email"
              type="email"
              name="entry.1258187363"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>

          <div class="form-field">
            <label for="mailing-message">
              Message <span class="form-optional">(optional)</span>
            </label>
            <textarea
              id="mailing-message"
              name="entry.633651603"
              rows="4"
              placeholder="Anything you’d like us to know—use cases, feature ideas, or just hello."
            ></textarea>
          </div>

          <div class="form-field">
            <label for="mailing-consent">
              <input
                id="mailing-consent"
                type="checkbox"
                name="entry.1516010901"
                value="I agree to receive dicotic updates via email."
                required
              />
              I agree to receive dicotic updates via email.
            </label>
          </div>

          <button type="submit" class="btn btn-primary mailing-form-submit">
            Subscribe
          </button>

          <p class="mailing-form-note">
            By submitting, you agree that your email may be stored for sending updates.
          </p>
        </form>
      </div>
    </main>

    <script>
      const startTime = Date.now();

      function handleSubmit(e) {
        const honeypot = document.getElementById("phone_number").value;
        const timeElapsed = Date.now() - startTime;

        // Block bots (honeypot filled OR too fast)
        if (honeypot || timeElapsed < 1500) {
          window.location.href = "thank-you.html";
          return false;
        }

        // Legit submission → redirect after slight delay
        setTimeout(() => {
          window.location.href = "thank-you.html";
        }, 500);

        return true;
      }
    </script>
  </body>
</html>
