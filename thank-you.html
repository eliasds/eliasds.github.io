<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dicotic – You’re on the list</title>
    <meta
      name="description"
      content="Thanks for joining the dicotic mailing list."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="img/icon.png" type="image/png" />
  </head>
  <body>
    <main class="legal-main mailing-page">
      <div class="container legal-container">
        <a href="index.html" class="legal-back-link">← Back to dicotic home</a>

        <header class="legal-header">
          <p class="eyebrow">You’re in</p>
          <h1>Thanks for joining</h1>
          <p class="legal-meta">
            If everything worked, you’ll be added after confirmation.
          </p>
        </header>

        <section class="legal-content">
          <p>
            Check your inbox for a confirmation email. If you do not confirm,
            you will not be added.
          </p>

          <p>
            In the meantime, feel free to explore the project or head back home.
          </p>

          <div style="margin-top: 2rem;">
            <a href="index.html" class="btn btn-primary">
              Back to home
            </a>
          </div>
        </section>
      </div>
    </main>
    <script src="src/analytics.js"></script>
    <script>
      if (window.dicoticAnalytics) {
        window.dicoticAnalytics.bindAnchorClicks({
          selector: ".legal-back-link, .btn.btn-primary",
          context: "mailing_thank_you",
        });
      }
    </script>
  </body>
</html>
